name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.24.x"
  REGISTRY: ghcr.io
  VITE_GAME_SERVICE_URL: "http://localhost:8080"
  VITE_RATING_SERVICE_URL: "http://localhost:8081"

jobs:
  compile-go-services:
    name: Compile Go services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test Go packages
        run: go test ./...

      - name: Build Linux binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/chess-game-service ./services/chess-game-service
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/chess-rating-service ./services/chess-rating-service

      - name: Upload Go binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-services
          retention-days: 7
          path: |
            bin/chess-game-service
            bin/chess-rating-service

  build-chess-game-service:
    name: Build chess-game-service image
    runs-on: ubuntu-latest
    needs: compile-go-services

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Go binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: go-services
          path: bin

      - name: Restore executable permissions
        run: chmod +x bin/chess-game-service

      - name: Prepare image namespace
        id: image_namespace
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_namespace.outputs.name }}/chess-game-service
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/chess-game-service/Dockerfile.runtime
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-chess-rating-service:
    name: Build chess-rating-service image
    runs-on: ubuntu-latest
    needs: compile-go-services

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Go binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: go-services
          path: bin

      - name: Restore executable permissions
        run: chmod +x bin/chess-rating-service

      - name: Prepare image namespace
        id: image_namespace
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_namespace.outputs.name }}/chess-rating-service
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/chess-rating-service/Dockerfile.runtime
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image namespace
        id: image_namespace
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_namespace.outputs.name }}/frontend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VITE_GAME_SERVICE_URL=${{ env.VITE_GAME_SERVICE_URL }}
            VITE_RATING_SERVICE_URL=${{ env.VITE_RATING_SERVICE_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
