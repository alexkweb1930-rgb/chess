stages:
  - compile
  - package

default:
  tags:
    - chess

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  VITE_GAME_SERVICE_URL: "http://localhost:8080"
  VITE_RATING_SERVICE_URL: "http://localhost:8081"

compile:go-services:
  stage: compile
  image: golang:1.24-alpine
  script:
    - mkdir -p bin
    - go test ./...
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/chess-game-service ./services/chess-game-service
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/chess-rating-service ./services/chess-rating-service
  artifacts:
    name: "go-services-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - bin/chess-game-service
      - bin/chess-rating-service

.docker-build:
  stage: package
  image: docker:27.5-cli
  services:
    - name: docker:27.5-dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

build:chess-game-service:
  extends: .docker-build
  needs:
    - job: compile:go-services
      artifacts: true
  script:
    - docker build --pull -f services/chess-game-service/Dockerfile.runtime -t "$CI_REGISTRY_IMAGE/chess-game-service:$IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE/chess-game-service:$IMAGE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE/chess-game-service:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/chess-game-service:latest"
        docker push "$CI_REGISTRY_IMAGE/chess-game-service:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE/chess-game-service:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/chess-game-service:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE/chess-game-service:$CI_COMMIT_TAG"
      fi

build:chess-rating-service:
  extends: .docker-build
  needs:
    - job: compile:go-services
      artifacts: true
  script:
    - docker build --pull -f services/chess-rating-service/Dockerfile.runtime -t "$CI_REGISTRY_IMAGE/chess-rating-service:$IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE/chess-rating-service:$IMAGE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE/chess-rating-service:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/chess-rating-service:latest"
        docker push "$CI_REGISTRY_IMAGE/chess-rating-service:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE/chess-rating-service:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/chess-rating-service:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE/chess-rating-service:$CI_COMMIT_TAG"
      fi

build:frontend:
  extends: .docker-build
  script:
    - docker build --pull -f frontend/Dockerfile --build-arg VITE_GAME_SERVICE_URL="$VITE_GAME_SERVICE_URL" --build-arg VITE_RATING_SERVICE_URL="$VITE_RATING_SERVICE_URL" -t "$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/frontend:latest"
        docker push "$CI_REGISTRY_IMAGE/frontend:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_TAG"
      fi
