global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client 30s
  timeout server 30s

frontend game_frontend
  bind *:8080
  default_backend game_services

frontend rating_frontend
  bind *:8081
  default_backend rating_services

frontend stats_frontend
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 5s

backend game_services
  balance roundrobin
  option httpchk GET /health
  http-response set-header X-Backend-Server %[srv_name]
  server game-a game-service-a:8080 check init-addr libc,none
  server game-b game-service-b:8080 check backup init-addr libc,none

backend rating_services
  balance roundrobin
  option httpchk GET /health
  http-response set-header X-Backend-Server %[srv_name]
  server rating-a rating-service-a:8081 check init-addr libc,none
  server rating-b rating-service-b:8081 check backup init-addr libc,none
