name: chess-platform

services:
  rating-service:
    image: ${REGISTRY_IMAGE}/chess-rating-service:${IMAGE_TAG:-latest}
    container_name: chess-rating-service
    environment:
      APP_ENV: ${APP_ENV:-prod}
    ports:
      - "${RATING_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  game-service:
    image: ${REGISTRY_IMAGE}/chess-game-service:${IMAGE_TAG:-latest}
    container_name: chess-game-service
    environment:
      APP_ENV: ${APP_ENV:-prod}
      RATING_SERVICE_BASE_URL: http://rating-service:8081
    depends_on:
      - rating-service
    ports:
      - "${GAME_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: ${REGISTRY_IMAGE}/frontend:${IMAGE_TAG:-latest}
    container_name: chess-platform-frontend
    depends_on:
      - game-service
      - rating-service
    ports:
      - "${FRONTEND_PORT:-3000}:80"
