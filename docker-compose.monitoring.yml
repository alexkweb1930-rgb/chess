services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: chess-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=5s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: chess-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18

  stats-collector:
    image: python:3.12-alpine
    container_name: chess-stats-collector
    working_dir: /app
    command: ["python", "/app/collector.py"]
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KIBANA_URL: http://kibana:5601
      POLL_INTERVAL_SECONDS: "10"
      STATS_TARGETS: chess-game-service=http://game-service:8080/stats,chess-rating-service=http://rating-service:8081/stats
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
      game-service:
        condition: service_healthy
      rating-service:
        condition: service_healthy
    volumes:
      - ./monitoring/stats-collector/collector.py:/app/collector.py:ro

volumes:
  elasticsearch-data:
